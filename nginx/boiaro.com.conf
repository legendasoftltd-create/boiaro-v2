server {
    server_name boiaro.com www.boiaro.com;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/boiaro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boiaro.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1024M;

    # =========================
    # API — ModSecurity OFF (Zod validates all inputs server-side;
    # WAF CRS false-positives on JSON/Bengali content break the app)
    # =========================
    location /api/ {
        modsecurity off;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================
    # tRPC — ModSecurity OFF (same reason: CRS blocks Bengali text
    # and complex JSON bodies with anomaly score ≥5)
    # =========================
    location /trpc/ {
        modsecurity off;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================
    # Upload API — ModSecurity OFF (binary multipart bodies)
    # =========================
    location /upload {
        modsecurity off;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1024M;
        proxy_request_buffering off;

        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 75s;
    }

    # =========================
    # Static local-fallback uploads
    # =========================
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Health check
    # =========================
    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # =========================
    # Dynamic OG image — generated by API server using sharp.
    # Exact-match so only /og-image.png routes here, not the SPA.
    # =========================
    location = /og-image.png {
        modsecurity off;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # FRONTEND — catch-all (ModSecurity ON for HTML pages is fine)
    # =========================
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name boiaro.com www.boiaro.com;
    return 301 https://$host$request_uri;
}
