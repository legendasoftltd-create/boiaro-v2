server {
    listen 80;
    server_name api.boiaro.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.boiaro.com;

    ssl_certificate /etc/letsencrypt/live/api.boiaro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boiaro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No Cloudflare proxy — direct to server, no 100MB limit
    client_max_body_size 1024M;

    # Disable ModSecurity for all API traffic (binary uploads, Bengali JSON)
    modsecurity off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 75s;
    }
}
