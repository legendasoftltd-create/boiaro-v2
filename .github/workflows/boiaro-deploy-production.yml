name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Build on the runner (7 GB RAM — no OOM risk) ──────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Build frontend
        run: npm run build

      # ── Upload built artifacts to server via rsync ────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Sync frontend dist
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/dist/

      - name: Sync server dist, prisma and package files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/dist/ \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/server/dist/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/prisma/ \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/server/prisma/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/package.json server/package-lock.json \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/server/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            ecosystem.production.config.cjs \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/

      # ── On server: only production deps + migrate + reload ────────────────
      - name: Install production deps and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_IP }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use default

            cd /var/www/html/boiaro.com/server
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy

            cd /var/www/html/boiaro.com
            pm2 startOrReload ecosystem.production.config.cjs --env production
            pm2 save
