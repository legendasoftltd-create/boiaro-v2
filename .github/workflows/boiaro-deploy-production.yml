name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Build on the runner ──────────────────────────────────────────────

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
        env:
          # prisma.config.ts calls env('DATABASE_URL') at load time.
          # A dummy value satisfies the check — generate never connects to DB.
          DATABASE_URL: "postgresql://ci:ci@localhost/ci"

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_REDX_ENV: ${{ secrets.VITE_REDX_ENV }}
          VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION }}

      # ── Upload built artifacts to server via rsync ───────────────────────

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Sync frontend dist
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/dist/

      - name: Sync server dist, prisma and package files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/dist/ \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/server/dist/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/prisma/ \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/server/prisma/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/package.json server/package-lock.json server/prisma.config.ts \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/server/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            ecosystem.production.config.cjs \
            ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_IP }}:/var/www/html/boiaro.com/

      # ── On server: install deps + migrate + reload ───────────────────────

      - name: Install production deps and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_IP }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            echo "=== Node version ==="
            node -v

            cd /var/www/html/boiaro.com/server

            echo "=== Installing production dependencies ==="
            npm ci --omit=dev

            echo "=== Generating Prisma client ==="
            npx prisma generate

            echo "=== Running database migrations ==="
            npx prisma migrate deploy

            echo "=== Reloading PM2 processes ==="
            cd /var/www/html/boiaro.com
            pm2 startOrReload ecosystem.production.config.cjs --env production
            pm2 save

            echo "=== Deploy complete ==="
            pm2 list
