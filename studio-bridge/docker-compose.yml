name: studio-bridge-dev

# All services use host networking — the simplest correct way to run LiveKit
# locally on Linux (avoids Docker NAT fighting WebRTC's dynamic UDP media
# ports) and lets everything, including the Bridge Relay running directly on
# the host, address everything else via plain "localhost".
services:
  redis:
    image: redis:alpine
    # Host networking means this is otherwise reachable on every interface
    # the box has — Redis has no auth by default, so bind it to localhost
    # explicitly rather than relying solely on the firewall. LiveKit/Egress
    # only ever address it as "localhost" anyway (see livekit-config.yaml /
    # egress-config.yaml), so this changes nothing functionally.
    command: ["redis-server", "--bind", "127.0.0.1", "-::1"]
    network_mode: host
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit-config.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    depends_on:
      - redis

  egress:
    image: livekit/egress:latest
    network_mode: host
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress-config.yaml:/etc/egress.yaml:ro
    # Egress needs elevated privileges + real /dev/shm for its bundled Chrome compositor
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    depends_on:
      - redis
      - livekit

  icecast:
    build: ./icecast
    network_mode: host
    restart: unless-stopped
